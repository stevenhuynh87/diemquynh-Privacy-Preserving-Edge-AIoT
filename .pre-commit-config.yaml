exclude: '^(reports/|results/|data/(Taramasco|MM-Fi|NTU_RGB\+D|UR_Fall)/|\.venv/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
